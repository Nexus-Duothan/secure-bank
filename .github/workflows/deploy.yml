name: SecureBank GCP CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
  # scripts/gcp-setup.sh creates a zonal cluster, so GKE must be addressed by
  # zone. Set GCP_CLUSTER_LOCATION to the region if the cluster is regional.
  GCP_CLUSTER_LOCATION: ${{ secrets.GCP_CLUSTER_LOCATION || secrets.GCP_ZONE || 'us-central1-a' }}
  GCP_CLUSTER_NAME: ${{ secrets.GCP_CLUSTER_NAME || 'securebank-cluster' }}
  GCP_REPOSITORY: ${{ secrets.GCP_REPOSITORY || 'secure-bank-repo' }}
  WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

jobs:
  test-and-build:
    name: Build Containers & Deploy to GKE
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build & Push Images via GCP Cloud Build
        run: |
          BUILD_ID=$(gcloud builds submit \
            --config=cloudbuild.yaml \
            --substitutions=_LOCATION=${{ env.GCP_REGION }},_REPOSITORY=${{ env.GCP_REPOSITORY }},SHORT_SHA=${{ github.sha }} \
            --async \
            --format="value(id)" \
            .)

          echo "🚀 Cloud Build submitted successfully! Build ID: ${BUILD_ID}"
          echo "⏳ Waiting for Cloud Build completion..."

          while true; do
            STATUS=$(gcloud builds describe "${BUILD_ID}" --format="value(status)")
            echo "Current Build Status: ${STATUS}"
            if [ "${STATUS}" = "SUCCESS" ]; then
              echo "✅ Cloud Build ${BUILD_ID} completed successfully!"
              break
            elif [ "${STATUS}" = "FAILURE" ] || [ "${STATUS}" = "CANCELLED" ] || [ "${STATUS}" = "TIMEOUT" ]; then
              echo "❌ Cloud Build ${BUILD_ID} failed with status: ${STATUS}"
              exit 1
            fi
            sleep 15
          done

      - name: Authenticate GKE kubectl
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GCP_CLUSTER_NAME }}
          location: ${{ env.GCP_CLUSTER_LOCATION }}

      - name: Deploy Manifests to GKE
        run: |
          IMAGE_PREFIX="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_REPOSITORY }}"

          # Point the manifests at Artifact Registry and pin this commit's tag.
          # Keeping ':latest' would leave the manifests byte-identical between
          # runs, so kubectl apply would be a no-op and no new image would roll out.
          sed -i -E "s|image: securebank/([a-z0-9-]+):latest|image: ${IMAGE_PREFIX}/\1:${{ github.sha }}|g" k8s/*.yaml

          # Fail loudly instead of deploying a manifest that still has a placeholder
          if grep -rn "image: securebank/" k8s/*.yaml; then
            echo "::error::Some manifests still reference the placeholder image name"
            exit 1
          fi

          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/01-configmaps-secrets.yaml
          kubectl apply -f k8s/02-infrastructure.yaml
          kubectl apply -f k8s/03-backend-services.yaml
          kubectl apply -f k8s/04-frontend.yaml
          kubectl apply -f k8s/05-ingress.yaml

      - name: Verify Rollout Status
        run: |
          for DEPLOYMENT in \
            frontend-web \
            api-gateway \
            auth-service \
            totp-service \
            user-service \
            accounts-service \
            transfer-service \
            payments-service \
            lending-service \
            notification-service \
            audit-recovery-service; do
            kubectl rollout status "deployment/${DEPLOYMENT}" -n securebank --timeout=300s
          done
