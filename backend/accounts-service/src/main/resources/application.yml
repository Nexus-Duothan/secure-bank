server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: accounts-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/securebank}
    username: ${SPRING_DATASOURCE_USERNAME:securebank}
    password: ${SPRING_DATASOURCE_PASSWORD:securebank_secret_pass}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    open-in-view: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

securebank:
  notification:
    service-url: ${SECUREBANK_NOTIFICATION_SERVICE_URL:http://localhost:8088}
  accounts:
    otp:
      expose-code: ${SECUREBANK_ACCOUNTS_OTP_EXPOSE_CODE:false}
