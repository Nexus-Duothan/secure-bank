server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: transfer-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/securebank}
    username: ${SPRING_DATASOURCE_USERNAME:securebank}
    password: ${SPRING_DATASOURCE_PASSWORD:securebank_secret_pass}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_transfer
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

securebank:
  transfer:
    cors:
      allowed-origins:
        - http://localhost:3000
        - http://localhost:5173
    limits:
      # FR-18: platform-wide defaults; a lower personal limit can be layered on later.
      per-transaction: 500000
      daily: 1000000
      # FR-16: transfers at or above this amount are blocked while a payee is cooling off.
      payee-cooling-off-threshold: 50000
    otp:
      # How long a staged payee waits for the caller's authenticator code, and how many wrong
      # codes burn the request.
      ttl: PT5M
      max-attempts: 5
    accounts-client:
      # accounts-service has no real ledger yet (mocked balances) - this base URL is the seam
      # that starts returning live balances once that service is implemented.
      base-url: ${ACCOUNTS_SERVICE_BASE_URL:http://localhost:8084}
    security:
      # Local prototype escape hatch only, mirrors user-service. Keep false unless you explicitly
      # want header-less requests to impersonate a fixed demo user id.
      allow-unauthenticated-demo-caller: ${SECUREBANK_TRANSFER_ALLOW_UNAUTHENTICATED_DEMO_CALLER:false}
      demo-user-id: ${SECUREBANK_TRANSFER_DEMO_USER_ID:00000000-0000-0000-0000-000000000001}

jwt:
  secret: ${JWT_SECRET:dGhpc0lzQVZlcnlTZWN1cmVTZWNyZXRLZXlGb3JTZWN1cmVCYW5rSkdUVG9rZW5zMjAyNiE=}

totp-service:
  url: ${TOTP_SERVICE_URL:http://localhost:8082}
