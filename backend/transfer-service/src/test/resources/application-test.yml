server:
  port: 0

spring:
  application:
    name: transfer-service-test
  datasource:
    url: jdbc:h2:mem:securebanktest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_transfer

securebank:
  transfer:
    limits:
      per-transaction: 1000
      daily: 1500

