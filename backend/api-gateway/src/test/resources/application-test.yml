server:
  port: 0

spring:
  application:
    name: api-gateway-test
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
        - id: totp-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/totp/**
        - id: user-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/users/**
        - id: payments-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/payments/**

jwt:
  secret: dGhpc0lzQVZlcnlTZWN1cmVTZWNyZXRLZXlGb3JTZWN1cmVCYW5rSkdUVG9rZW5zMjAyNiE=

gateway:
  public-paths:
    - /api/v1/auth/login
    - /api/v1/auth/register
    - /actuator/health
