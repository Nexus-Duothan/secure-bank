server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
        - id: user-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/users/**
        - id: accounts-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/accounts/**
        - id: transfer-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/transfers/**
        - id: payments-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/payments/**
        - id: lending-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/loans/**
