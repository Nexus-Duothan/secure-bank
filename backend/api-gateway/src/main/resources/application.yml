server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: totp-service
          uri: ${TOTP_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/totp/**
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/users/**
        - id: accounts-service
          uri: ${ACCOUNTS_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/accounts/**
        - id: transfer-service
          uri: ${TRANSFER_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/transfers/**
        - id: payments-service
          uri: ${PAYMENTS_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/payments/**
        - id: lending-service
          uri: ${LENDING_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/loans/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/v1/notifications/**
        # The transaction journal is served by notification-service and must be matched before
        # the audit-recovery routes below, which own the rest of /api/v1/audit/**.
        - id: audit-journal
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/v1/audit/transactions
        - id: audit-service
          uri: ${AUDIT_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/v1/audit/**

jwt:
  secret: ${JWT_SECRET:dGhpc0lzQVZlcnlTZWN1cmVTZWNyZXRLZXlGb3JTZWN1cmVCYW5rSkdUVG9rZW5zMjAyNiE=}

gateway:
  public-paths:
    - /api/v1/auth/login
    - /api/v1/auth/login/verify-mfa
    - /api/v1/auth/resend-otp
    - /api/v1/auth/register
    - /api/v1/auth/register/verify-phone
    - /api/v1/auth/refresh
    # Requesting a reset link and confirming it both happen before the customer can sign in.
    - /api/v1/auth/password-reset/**
    - /api/v1/totp/setup/**
    - /api/v1/totp/enable
    - /actuator/health
    - /actuator/info
