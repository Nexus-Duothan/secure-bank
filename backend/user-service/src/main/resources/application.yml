server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: user-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/securebank}
    username: ${SPRING_DATASOURCE_USERNAME:securebank}
    password: ${SPRING_DATASOURCE_PASSWORD:securebank_secret_pass}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_user
    baseline-on-migrate: true

securebank:
  user:
    cors:
      allowed-origins:
        - http://localhost:3000
        - http://localhost:5173
    otp:
      ttl: PT5M
      max-attempts: 5
      # Local prototype only: set this to true only when you explicitly want the generated OTP
      # echoed back in the challenge response for a browser-only demo.
      expose-code: ${SECUREBANK_USER_OTP_EXPOSE_CODE:false}
    security:
      # Local prototype escape hatch only. Keep this false unless you explicitly want
      # header-less requests to impersonate the first seeded demo profile.
      allow-unauthenticated-demo-caller: ${SECUREBANK_USER_ALLOW_UNAUTHENTICATED_DEMO_CALLER:false}

jwt:
  secret: ${JWT_SECRET:dGhpc0lzQVZlcnlTZWN1cmVTZWNyZXRLZXlGb3JTZWN1cmVCYW5rSkdUVG9rZW5zMjAyNiE=}
