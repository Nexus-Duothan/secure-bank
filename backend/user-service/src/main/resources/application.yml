server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: user-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/securebank}
    username: ${SPRING_DATASOURCE_USERNAME:securebank}
    password: ${SPRING_DATASOURCE_PASSWORD:securebank_secret_pass}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_user
    baseline-on-migrate: true

securebank:
  notification:
    service-url: ${SECUREBANK_NOTIFICATION_SERVICE_URL:http://localhost:8088}
  user:
    cors:
      allowed-origins:
        - http://localhost:3000
        - http://localhost:5173
    otp:
      ttl: PT5M
      max-attempts: 5
      # Local prototype default: echo the generated OTP back in the challenge response so the
      # browser-only flow works without a live SMS/email delivery integration. Override to false
      # when you want to test real notification-based delivery behavior.
      expose-code: ${SECUREBANK_USER_OTP_EXPOSE_CODE:true}
    security:
      # Local prototype escape hatch only. Keep this false unless you explicitly want
      # header-less requests to impersonate the first seeded demo profile.
      allow-unauthenticated-demo-caller: ${SECUREBANK_USER_ALLOW_UNAUTHENTICATED_DEMO_CALLER:false}

jwt:
  secret: ${JWT_SECRET:dGhpc0lzQVZlcnlTZWN1cmVTZWNyZXRLZXlGb3JTZWN1cmVCYW5rSkdUVG9rZW5zMjAyNiE=}
