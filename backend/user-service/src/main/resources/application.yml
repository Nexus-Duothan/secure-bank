server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: user-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/securebank}
    username: ${SPRING_DATASOURCE_USERNAME:securebank}
    password: ${SPRING_DATASOURCE_PASSWORD:securebank_secret_pass}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_user
    baseline-on-migrate: true

securebank:
  user:
    seed-demo-data: true
    cors:
      allowed-origins:
        - http://localhost:3000
        - http://localhost:5173
    otp:
      ttl: PT5M
      max-attempts: 5
      # Local prototype only: echoes the generated code back in the challenge response so the
      # web UI can be demoed without the notification-service. MUST be false outside local dev.
      expose-code: true
    security:
      # Until the API Gateway issues verified JWTs, requests without an X-User-Id header are
      # resolved to the seeded demo customer. MUST be false outside local dev (NFR-S3).
      allow-unauthenticated-demo-caller: true
