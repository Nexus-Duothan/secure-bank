server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: user-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/securebank}
    username: ${SPRING_DATASOURCE_USERNAME:securebank}
    password: ${SPRING_DATASOURCE_PASSWORD:securebank_secret_pass}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_user
    baseline-on-migrate: true

securebank:
  notification:
    service-url: ${SECUREBANK_NOTIFICATION_SERVICE_URL:http://localhost:8088}
  user:
    cors:
      allowed-origins:
        - http://localhost:3000
        - http://localhost:5173
    otp:
      # How long a staged change waits for the customer's authenticator code, and how many
      # wrong codes burn the request.
      ttl: PT5M
      max-attempts: 5
    security:
      # Local prototype escape hatch only. Keep this false unless you explicitly want
      # header-less requests to impersonate the first seeded demo profile.
      allow-unauthenticated-demo-caller: ${SECUREBANK_USER_ALLOW_UNAUTHENTICATED_DEMO_CALLER:false}

totp-service:
  url: ${TOTP_SERVICE_URL:http://localhost:8082}

# auth-service owns sign-in: administrative role and status changes are pushed to it.
auth-service:
  url: ${AUTH_SERVICE_URL:http://localhost:8081}

# Probed by the admin System health panel. Every platform service is listed so the panel reports
# what is actually reachable rather than a fixed list.
api-gateway:
  url: ${API_GATEWAY_URL:http://localhost:8080}
accounts-service:
  url: ${ACCOUNTS_SERVICE_URL:http://localhost:8084}
transfer-service:
  url: ${TRANSFER_SERVICE_URL:http://localhost:8085}
payments-service:
  url: ${PAYMENTS_SERVICE_URL:http://localhost:8086}
lending-service:
  url: ${LENDING_SERVICE_URL:http://localhost:8087}
notification-service:
  url: ${NOTIFICATION_SERVICE_URL:http://localhost:8088}
audit-service:
  url: ${AUDIT_SERVICE_URL:http://localhost:8089}

jwt:
  secret: ${JWT_SECRET:dGhpc0lzQVZlcnlTZWN1cmVTZWNyZXRLZXlGb3JTZWN1cmVCYW5rSkdUVG9rZW5zMjAyNiE=}
