server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: lending-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/securebank}
    username: ${SPRING_DATASOURCE_USERNAME:securebank}
    password: ${SPRING_DATASOURCE_PASSWORD:securebank_secret_pass}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_lending
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Default is 60s — event publishing must fail fast, not hang a loan/repayment
        # request, when no broker is reachable (no consumer exists yet anyway).
        max.block.ms: 3000

jwt:
  secret: ${JWT_SECRET:dGhpc0lzQVZlcnlTZWN1cmVTZWNyZXRLZXlGb3JTZWN1cmVCYW5rSkdUVG9rZW5zMjAyNiE=}
  access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:300}

totp-service:
  url: ${TOTP_SERVICE_URL:http://localhost:8082}

securebank:
  lending:
    accounts-client:
      # accounts-service owns the ledger; balances are read from its /internal routes, which the
      # API gateway does not publish.
      base-url: ${ACCOUNTS_SERVICE_BASE_URL:http://localhost:8084}
    loan:
      # Platform-wide application bounds.
      min-amount: 10000
      max-amount: 5000000
      min-term-months: 6
      max-term-months: 60
      # Flat estimated/offered rate; no risk-based pricing model exists yet.
      default-annual-interest-rate: 11.5
    repayment:
      # The retry policy is a documented judgment call rather than a given: retry
      # once a day for up to 3 attempts before marking the installment OVERDUE.
      max-attempts: 3
      retry-interval: PT24H
      # How long before the due date a reminder event is published.
      reminder-lead-time: PT72H

lending:
  kafka:
    disbursed-topic: ${LOANS_DISBURSED_TOPIC:loans.disbursed.v1}
    reminder-topic: ${LOANS_REPAYMENT_REMINDER_TOPIC:loans.repayment-reminder.v1}
    overdue-topic: ${LOANS_REPAYMENT_OVERDUE_TOPIC:loans.repayment-overdue.v1}
