server:
  port: 0

spring:
  application:
    name: payments-service-test
  datasource:
    url: jdbc:h2:mem:securebanktest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_payments
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: 1000

jwt:
  secret: dGhpc0lzQVZlcnlTZWN1cmVTZWNyZXRLZXlGb3JTZWN1cmVCYW5rSkdUVG9rZW5zMjAyNiE=
  access-token-expiration-seconds: 300

accounts-service:
  base-url: http://localhost:8084

audit-service:
  base-url: http://127.0.0.1:8089
  api-key: test-key

payments:
  receipt-secret: test-receipt-secret
  kafka:
    completed-topic: payments.completed.v1
    held-topic: payments.held-for-review.v1
