server:
  port: 0

spring:
  application:
    name: totp-service-test
  datasource:
    url: jdbc:h2:mem:totptest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

totp:
  issuer: SecureBankTest
