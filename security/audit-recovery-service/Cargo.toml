[package]
name = "audit-recovery-service"
version = "0.1.0"
edition = "2021"
authors = ["Team Nexus <team@securebank.com>"]
description = "Immutable audit journaling and automated system state recovery service for SecureBank."

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.8", features = ["v4", "serde"] }
getrandom = "=0.2.15"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3.10"
