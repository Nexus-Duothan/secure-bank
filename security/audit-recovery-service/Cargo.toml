[package]
name = "audit-recovery-service"
version = "0.1.0"
edition = "2021"
authors = ["Team Nexus <team@securebank.com>"]
description = "Immutable audit journaling and automated system state recovery service for SecureBank."

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
