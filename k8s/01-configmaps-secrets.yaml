apiVersion: v1
kind: ConfigMap
metadata:
  name: securebank-config
  namespace: securebank
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://securebank-postgres:5432/securebank"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
  SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
  SPRING_FLYWAY_BASELINE_VERSION: "0"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "securebank-kafka:9092"
  JWT_EXPIRATION_MS: "86400000"
  AUTH_SERVICE_URL: "http://auth-service:8081"
  TOTP_SERVICE_URL: "http://totp-service:8082"
  USER_SERVICE_URL: "http://user-service:8083"
  ACCOUNTS_SERVICE_URL: "http://accounts-service:8084"
  # Service to service base URL for the ledger's /internal routes (transfer, payments, lending,
  # and the audit journal read side).
  ACCOUNTS_SERVICE_BASE_URL: "http://accounts-service:8084"
  TRANSFER_SERVICE_URL: "http://transfer-service:8085"
  PAYMENTS_SERVICE_URL: "http://payments-service:8086"
  LENDING_SERVICE_URL: "http://lending-service:8087"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8088"
  AUDIT_SERVICE_URL: "http://audit-recovery-service:8089"
---
apiVersion: v1
kind: Secret
metadata:
  name: securebank-secrets
  namespace: securebank
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "securebank"
  SPRING_DATASOURCE_PASSWORD: "securebank_prod_password"
  POSTGRES_USER: "securebank"
  POSTGRES_PASSWORD: "securebank_prod_password"
  JWT_SECRET: "c2VjdXJlYmFua19zZWNyZXRfa2V5X2Zvcl9qd3RfdG9rZW5fZ2VuZXJhdGlvbl8yMDI2"
