apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: securebank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: securebank/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: securebank-config
            - secretRef:
                name: securebank-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: securebank
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: api-gateway
---
